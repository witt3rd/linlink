[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "linlink"
version = "0.2.0"
description = "lin-aware link and citation tool — uuid-anchored references that survive renames, across and within corpora."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Donald Thompson and the linlink authors" }]
keywords = ["markdown", "links", "zettelkasten", "uuid", "citations", "self-healing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Text Processing :: Markup :: Markdown",
]

[project.scripts]
linlink = "linlink.cli:main"

[tool.setuptools]
packages = ["linlink"]